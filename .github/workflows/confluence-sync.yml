name: confluence-sync

on:
  workflow_dispatch:
    inputs:
      architecture_root_page_id:
        description: Confluence root page ID for Architecture
        required: true
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Confluence page
        env:
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          CONFLUENCE_USER_EMAIL: ${{ secrets.CONFLUENCE_USER_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          ARCH_ROOT_PAGE_ID: ${{ inputs.architecture_root_page_id }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$CONFLUENCE_BASE_URL" ] || [ -z "$CONFLUENCE_USER_EMAIL" ] || [ -z "$CONFLUENCE_API_TOKEN" ]; then
            echo "Missing Confluence secrets. Ensure CONFLUENCE_BASE_URL, CONFLUENCE_USER_EMAIL, CONFLUENCE_API_TOKEN are set." >&2
            exit 1
          fi

          if [ -z "$ARCH_ROOT_PAGE_ID" ]; then
            echo "Missing required inputs." >&2
            exit 1
          fi

          python .github/workflows/python/confluence_sync.py

      - name: Show mirrored files
        run: |
          set -euo pipefail
          ls -la "SpecsMirror/Architecture"

      - name: Commit and push mirrored files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add SpecsMirror
            git commit -m "chore: sync Confluence specs"
            git push
          else
            echo "No changes to commit."
          fi
