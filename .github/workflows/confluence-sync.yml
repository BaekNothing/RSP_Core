name: confluence-sync

on:
  workflow_dispatch:
    inputs:
      feature_key:
        description: Feature key (e.g., FTR-0123)
        required: true
        type: string
      confluence_page_id:
        description: Confluence page ID
        required: true
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Confluence page
        env:
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          CONFLUENCE_USER_EMAIL: ${{ secrets.CONFLUENCE_USER_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          FEATURE_KEY: ${{ inputs.feature_key }}
          PAGE_ID: ${{ inputs.confluence_page_id }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$CONFLUENCE_BASE_URL" ] || [ -z "$CONFLUENCE_USER_EMAIL" ] || [ -z "$CONFLUENCE_API_TOKEN" ]; then
            echo "Missing Confluence secrets. Ensure CONFLUENCE_BASE_URL, CONFLUENCE_USER_EMAIL, CONFLUENCE_API_TOKEN are set." >&2
            exit 1
          fi

          if [ -z "$FEATURE_KEY" ] || [ -z "$PAGE_ID" ]; then
            echo "Missing required inputs." >&2
            exit 1
          fi

          mkdir -p "SpecsMirror/$FEATURE_KEY"

          python - <<'PY'
import base64
import json
import os
import urllib.request
from datetime import datetime, timezone
from html.parser import HTMLParser

base_url = os.environ['CONFLUENCE_BASE_URL'].rstrip('/')
user = os.environ['CONFLUENCE_USER_EMAIL']
token = os.environ['CONFLUENCE_API_TOKEN']
feature_key = os.environ['FEATURE_KEY']
page_id = os.environ['PAGE_ID']

url = f"{base_url}/rest/api/content/{page_id}?expand=body.storage,version,_links"
req = urllib.request.Request(url)
auth_bytes = f"{user}:{token}".encode("utf-8")
req.add_header("Authorization", "Basic " + base64.b64encode(auth_bytes).decode("utf-8"))
req.add_header("Accept", "application/json")

with urllib.request.urlopen(req) as resp:
    data = json.load(resp)

storage_html = data.get("body", {}).get("storage", {}).get("value", "")
page_title = data.get("title", "Untitled")
version_number = data.get("version", {}).get("number")
links = data.get("_links", {})
webui = links.get("webui")
canonical_url = f"{base_url}{webui}" if webui else None

class MinimalMarkdownParser(HTMLParser):
    def __init__(self):
        super().__init__()
        self.parts = []

    def handle_starttag(self, tag, attrs):
        if tag in {"p", "div", "br", "h1", "h2", "h3", "h4", "h5", "h6"}:
            self.parts.append("\n")
        if tag == "li":
            self.parts.append("\n- ")

    def handle_endtag(self, tag):
        if tag in {"p", "div", "li", "h1", "h2", "h3", "h4", "h5", "h6"}:
            self.parts.append("\n")

    def handle_data(self, data):
        self.parts.append(data)

parser = MinimalMarkdownParser()
parser.feed(storage_html)
text = "".join(parser.parts).strip()

spec_path = os.path.join("SpecsMirror", feature_key, "spec.md")
meta_path = os.path.join("SpecsMirror", feature_key, "meta.json")

with open(spec_path, "w", encoding="utf-8") as f:
    f.write(f"# {page_title}\n\n")
    if canonical_url:
        f.write(f"Source: {canonical_url}\n\n")
    f.write(text + "\n")

meta = {
    "page_id": page_id,
    "fetched_at_utc": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
    "confluence_version": version_number,
}
if canonical_url:
    meta["canonical_url"] = canonical_url

with open(meta_path, "w", encoding="utf-8") as f:
    json.dump(meta, f, indent=2)
    f.write("\n")
PY

      - name: Show mirrored files
        run: |
          set -euo pipefail
          ls -la "SpecsMirror/${{ inputs.feature_key }}"
